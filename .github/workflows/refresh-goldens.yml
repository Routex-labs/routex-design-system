name: Refresh goldens

# 골든은 `@TestOn('linux')`이라 macOS에서는 만들 수 없다. 지금까지는 Ubuntu가 있는
# 사람이 손으로 돌려야 했고, 그 사람이 없는 날 골든이 밀렸다. 재생성을 verify와 같은
# runner·같은 Flutter 버전에 맡겨 두면 누가 무슨 기기를 쓰든 결과가 같다.
#
# 결과를 commit해 주지는 않는다 — 무엇이 왜 바뀌었는지 사람이 보고 넣는다.
# artifact를 받아 `apps/showcase/test/goldens`에 풀고 diff를 확인한 뒤 commit한다.

# main에 들어간 뒤에는 버튼(workflow_dispatch)으로 돌린다. push 조건은 작업
# 브랜치에서 **그린 그림이 달라질 수 있는 파일**을 건드렸을 때만 걸린다 —
# workflow_dispatch는 기본 branch에 있는 workflow만 부를 수 있어서, 작업 중에는
# 이 조건이 유일한 길이다.
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'packages/routex_design_system/lib/**'
      - 'apps/showcase/lib/**'
      - '.github/workflows/refresh-goldens.yml'

permissions:
  contents: read

concurrency:
  group: refresh-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/showcase
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      # 골든이 아닌 test는 여기서 실패해도 갱신을 막지 않는다 — 그쪽 판정은 verify가 한다.
      - run: flutter test --update-goldens
      - uses: actions/upload-artifact@v7
        with:
          name: showcase-goldens-${{ github.run_attempt }}
          path: apps/showcase/test/goldens
          if-no-files-found: error
          retention-days: 7
